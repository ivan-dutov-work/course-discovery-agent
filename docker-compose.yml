services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: course_discovery
    ports:
      - "55432:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d course_discovery"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
