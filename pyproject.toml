[project]
name = "course-discovery-agent"
version = "0.1.0"
description = "LangGraph-powered course discovery agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"langgraph>=0.6.0",
	"pydantic>=2.11.7",
	"rapidfuzz>=3.14.1",
	"python-dotenv>=1.1.1",
	"psycopg[binary]>=3.2",
	"langchain-openrouter>=0.2.9",
	"langgraph-checkpoint-postgres>=3.1.2",
	"opentelemetry-sdk>=1.45.0",
	"opentelemetry-exporter-otlp-proto-http>=1.45.0",
	"openinference-instrumentation-langchain>=0.1.76",
	"opentelemetry-instrumentation-psycopg>=0.66b0",
	"presidio-analyzer>=2.2.364",
	"presidio-anonymizer>=2.2.364",
	"en-core-web-sm",
	"cryptography>=48.0.1",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
