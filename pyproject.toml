[project]
name = "course-discovery-agent"
version = "0.1.0"
description = "LangGraph-powered course discovery agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"langgraph>=0.6.0",
	"pydantic>=2.11.7",
	"rapidfuzz>=3.14.1",
	"python-dotenv>=1.1.1",
	"psycopg[binary]>=3.2",
	"langchain-openrouter>=0.2.9",
]

[dependency-groups]
dev = [
    "langgraph-checkpoint-postgres>=3.1.2",
]
